name: 핫딜 갱신 (골드박스)

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (21:00 UTC)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: shop-site-sync
  cancel-in-progress: false

jobs:
  refresh:
    # NAS 러너에서 돌아 커밋 직후 사이트 폴더까지 바로 반영한다
    runs-on: [self-hosted, nas, shop]
    steps:
      - uses: actions/checkout@v5

      - name: 골드박스 특가 수집
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python3 scripts/fetch-deals.py

      - name: 변경 시 커밋
        run: |
          if [ -n "$(git status --porcelain data/deals.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/deals.json
            git commit -m "핫딜 자동 갱신 (골드박스)"
            git push
          else
            echo "변경 없음 — 스킵"
          fi

      - name: 사이트 폴더에 반영
        run: rsync -a --delete --exclude '.git/' --exclude '.github/' ./ /srv/shop/
